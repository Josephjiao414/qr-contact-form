<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9月16日牧会者集会｜交流登记</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <div id="successOverlay" class="success-overlay hidden"></div>
    <div id="successModal" class="success-modal hidden" role="dialog" aria-modal="true" aria-labelledby="successTitle" tabindex="-1">
      <div class="success-icon">✓</div>
      <h2 id="successTitle">提交成功</h2>
      <p id="successMsg">感谢您的参与，我们会按照您留下的方式与您联系。</p>
      <div class="wechat-contact">
        <p class="wechat-contact-title">添加联络同工微信</p>
        <a class="wechat-qr-link" href="/wechat-contact-qr.png" target="_blank" rel="noopener" aria-label="点击查看联络同工微信二维码大图">
          <img src="/wechat-contact-qr.png" width="650" height="650" alt="联络同工微信二维码">
        </a>
        <p class="wechat-contact-hint">点击二维码查看大图，长按保存后可在微信中识别添加。</p>
      </div>
      <button type="button" class="btn btn-secondary" onclick="closeSuccess()">暂时关闭</button>
    </div>

    <div class="container">
      <div class="card">
        <div class="card-header">
          <p class="brand">全球华人教牧同工联盟</p>
          <h1>9月16日第三次牧会者集会</h1>
          <p class="event-meta">约拿牧师带领 · 晚上 · 线上聚会</p>
          <p class="subtitle">欢迎留下联系方式，以及您在牧养或事工中希望进一步交流的问题。</p>
        </div>

        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">姓名／称呼<span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="我们应当如何称呼您" autocomplete="name" aria-describedby="nameError" required>
            <p class="error-text" id="nameError" aria-live="polite"></p>
          </div>
          <div class="form-group">
            <label for="region">地区</label>
            <input type="text" id="region" name="region" placeholder="城市、地区或所在教会">
          </div>
          <div class="form-group">
            <label for="phone">联系电话／微信号<span class="required">*</span></label>
            <input type="text" id="phone" name="phone" placeholder="留下方便联系您的方式" autocomplete="tel" aria-describedby="phoneError">
            <p class="error-text" id="phoneError" aria-live="polite"></p>
          </div>
          <div class="form-group">
            <label for="email">邮箱（选填）</label>
            <input type="email" id="email" name="email" placeholder="如常用邮箱方便联系，也可以填写" autocomplete="email" aria-describedby="emailError">
            <p class="error-text" id="emailError" aria-live="polite"></p>
          </div>
          <div class="form-group">
            <label for="message">希望交流的问题（选填）</label>
            <textarea id="message" name="message" rows="4" placeholder="例如：牧养、教会复兴、同工配搭或其他实际困难"></textarea>
          </div>
          <p class="privacy-note">提交后，联络同工会按照您留下的方式联系。信息仅用于本次集会通知和后续牧养交流，不作公开展示。</p>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span id="btnText">提交交流登记</span>
            <span id="btnSpinner" class="spinner hidden"></span>
          </button>
        </form>

        <div class="card-footer">
          <a href="https://global-chinese-pastors-alliance.onrender.com/">返回全球华人教牧同工联盟网站</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/scripts.js"></script>
</body>
</html>
