databases:
  - name: qr-contact-form-db
    plan: free

services:
  - type: web
    name: qr-contact-form
    env: node
    repo: https://github.com/Josephjiao414/qr-contact-form.git
    buildCommand: pnpm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PW
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qr-contact-form-db
          property: connectionString
